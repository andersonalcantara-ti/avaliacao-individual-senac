<!--
QUESTÃO 03:
Imagine que você está planejando um formulário de cadastro para um novo aplicativo. Este formulário solicitará um nome de usuário e um e-mail. Para garantir que os dados sejam inseridos corretamente e que o sistema funcione bem, é essencial aplicar regras de validação. Com base nesse cenário, elabore uma resposta que contemple os seguintes pontos:
O material da disciplina explica que a validação de formulários é crucial. Com suas palavras, explique por que é importante validar os dados que um usuário insere em um formulário. Em seguida, descreva como você usaria os atributos HTML required e minlength para garantir que o campo nome de usuário não seja deixado em branco e tenha no mínimo 5 caracteres.".
Agora, pense no campo e-mail. Apenas garantir que o campo não está vazio não é suficiente; é preciso verificar se o que foi digitado parece mesmo um e-mail. Descreva, em um passo a passo lógico, como o sistema deveria agir para validar o campo de e-mail e como ele deveria informar ao usuário caso o formato esteja incorreto.
Muitas vezes, mesmo com toda a validação, um erro inesperado pode acontecer ao enviar o formulário (por exemplo, uma falha de conexão com a internet). O material apresenta o bloco try...catch como uma forma de capturar e tratar esses erros. Explique, com suas palavras, qual é a finalidade do try...catch nesse contexto.
-->

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questao 03</title>

    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        };
    </style>
</head>

<body>
    <section>
        <h1>Formulário</h1>

        <form id="formulario">
            <div id="campo-nome">
                <label>Insira seu nome</label>
                <input id="nome" placeholder="Digite seu Nome" required>
            </div>
            
            <div id="campo-email">
                <label>Insira seu E-Mail</label>
                <input id="mail" placeholder="Digite seu E-Mail" required>
            </div>

            <button type="submit" id="btn">Enviar</button>
        </form>




        

        <form>
            <input id="nome" name="nome" placeholder="Digite seu nome" required minlength="5">
            <input type="email" id="mail" placeholder="Digite seu e-mail">
            <button>Enviar</button>

        </form>
        <script>
            let email = document.getElementById("mail")
            mail.addEventListener("input", function (event) {
                if (mail.validity.typeMismatch) {
                    mail.setCustomValidity("E-Mail Válido por favor");
                } else {
                    mail.setCustomValidity("");
                }
            });
        </script>
    </section>
</body>

</html>
