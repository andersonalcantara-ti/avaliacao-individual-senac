<!--
QUESTÃO 02: 
Imagine que você está planejando criar uma página web simples para uma "Lista de Tarefas". A ideia é que o usuário possa digitar uma nova tarefa em um campo de texto, clicar em um botão "Adicionar" para que a tarefa apareça em uma lista na tela e, o mais importante, que essa lista não desapareça mesmo que o usuário feche e reabra o navegador.
Com base nesse cenário, elabore uma resposta que contemple os seguintes pontos:
Descreva, em um passo a passo lógico, o que acontece desde o momento em que o usuário clica no botão "Adicionar" até a nova tarefa aparecer na tela. Sua explicação deve mencionar os conceitos de evento de clique e a manipulação do DOM (Document Object Model) para criar e adicionar um novo elemento à página.
Para que a lista de tarefas não seja perdida ao fechar o navegador, é preciso usar o armazenamento local (storage). O material da disciplina apresenta duas formas: localStorage e sessionStorage. Qual das duas você escolheria para essa funcionalidade? Justifique sua resposta com base na principal diferença entre elas.
O formato JSON é ideal para organizar os dados que serão guardados no armazenamento local. Descreva em formato de texto ou lista como seria a estrutura em JSON para guardar duas tarefas. Cada tarefa deve ser um objeto com duas propriedades: uma para o título da tarefa e outra para o status (que pode ser "Pendente" ou "Concluído"). 
-->


<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questao 02</title>

    <!--CSS-->
    <style>
        /*Reset*/
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>

</head>

<body>
    <section>
        <h1>Lista de Tarefas</h1>
       
        <form id="form-tarefas"><!--Formulário-->
            <label for="input-tarefas">Crie uma Tarefa</label><br>
            <input type="text" name="form-tarefas" id="input-tarefas" placeholder="Digite a nova Tarefa" minlength="5" maxlength="10" required><br>
            <button type="submit" id="btn">Adicionar Tarefa</button>
        </form>

        <div><!--Lista de Tarefas Não Ordenada-->
            <ul id="lista-de-tarefas"></ul>
        </div>
    </section>

    <script>//Lógica
        const form = document.querySelector("#form-tarefas");
        const inputTarefas = document.querySelector("#input-tarefas");
        const listaDeTarefas = document.querySelector("#lista-de-tarefas");

        const Tarefas = [];//Cria um array para guardar as tarefas

        function adicionarTarefas(){
            form.addEventListener("submit", function(event){
                event.preventDefault();
                console.log("Teste: Botão Clicado");//teste, apenas

                const novaTarefa = inputTarefas.value.trim(); //Pega o que foi digitado no campo input
                if (novaTarefa !== ""){
                    const newTarefa = {
                        id: Date.now(),
                        nome: novaTarefa
                    };
                    Tarefas.push(novaTarefa);
                    
                    const li = document.createElement("li");
                    li.dataset.id = newTarefa.id;
                    li.textContent = newTarefa.nome;

                    listaDeTarefas.appendChild(li);

                    inputTarefas.value = ""; //reset o campo input
                };
            });
        };

        adicionarTarefas(); //chama a função
    </script>
    
</body>
</html>
